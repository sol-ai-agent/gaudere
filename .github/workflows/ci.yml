name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install build dependencies
        run: >
          dnf install -y
          autoconf
          automake
          gcc-c++
          git
          libtool
          make
          pkgconf-pkg-config
          sqlite-devel

      - uses: actions/checkout@v4

      - name: Generate build system
        run: autoreconf --install --force

      - name: Configure
        run: >
          mkdir build &&
          cd build &&
          ../configure
          CXXFLAGS="-O2 -Wall -Wextra -Wpedantic -Werror"

      - name: Build and test
        run: make --directory=build --jobs=2 check

      - name: Verify installation metadata
        run: |
          make --directory=build install DESTDIR="$PWD/stage"
          export PKG_CONFIG_PATH="$PWD/stage/usr/local/lib/pkgconfig"
          pkg-config --define-variable=prefix="$PWD/stage/usr/local"             --cflags --libs gaudere gaudere-persistence-sqlite
