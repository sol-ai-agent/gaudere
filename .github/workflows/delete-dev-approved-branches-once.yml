name: One-shot delete Dev-approved stale branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/delete-dev-approved-branches-once.yml

permissions:
  contents: write

jobs:
  delete-approved-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete exact Dev-approved branch list
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'agent/add-fedora-ci'
            'agent/add-pkg-config'
            'agent/bounded-task-contracts'
            'agent/external-effect-start'
            'agent/lease-recovery-deadline'
            'agent/pending-task-selection'
            'core/budget-snapshot'
            'core/durable-call-budget'
            'core/explicit-exact-wake-v0'
            'core/task-result-metadata'
          )

          failures=0
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              if git push origin --delete "$branch"; then
                echo "deleted=$branch"
              else
                echo "::error::failed to delete $branch"
                failures=$((failures + 1))
              fi
            else
              echo "already_absent=$branch"
            fi
          done

          if (( failures != 0 )); then
            echo "::error::$failures branch deletion(s) failed"
            exit 1
          fi

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "::error::branch still exists after cleanup: $branch"
              exit 1
            fi
          done

          echo "deleted_or_already_absent=${#branches[@]}"
